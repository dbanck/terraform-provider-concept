# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs the tests for pull requests and pushes to main.
on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Cancel outdated runs of the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ensure the project builds and passes basic static checks before running
  # the (slower) test matrix.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...

  # Ensure go.mod is tidy and the generated documentation is up to date.
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true
      # tfplugindocs uses Terraform to read the provider schema. List resources
      # are only documented with Terraform 1.14 and later.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false
      - run: go mod tidy
      - run: make docs
      - name: git diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes after running 'go mod tidy' and 'make docs'. Run them locally and commit the result."
            git status --short
            git diff
            exit 1
          fi

  # Run the tests against a real Terraform binary. Resource identity requires
  # Terraform 1.12 and Terraform Search (query) requires 1.14; tests that need
  # a newer version are skipped automatically on older versions.
  test:
    name: Terraform Provider Tests (Terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.14.*"
          - "1.15.*"
          - "1.16.*"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          # The wrapper script interferes with terraform-plugin-testing
          terraform_wrapper: false
      - run: go mod download
      - run: go test -v -cover -count=1 ./...
        timeout-minutes: 10
